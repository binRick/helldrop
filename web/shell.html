<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HELLDROP</title>
<style>
  :root { --red:#e23b2e; --ember:#ff7a2a; --blood:#7a0f0f; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body {
    font-family:'Courier New', monospace; color:#d9c7b0;
    display:flex; align-items:center; justify-content:center;
  }
  /* raylib draws a 1600x900 buffer; CSS letterboxes it into the viewport. */
  canvas.emscripten {
    display:block; border:0; outline:none;
    width:100vw; height:100vh; object-fit:contain;
    image-rendering:auto; background:#0a0708;
  }

  /* Start gate: an opaque overlay until the first click, which both reveals
     the game and supplies the user gesture browsers need to start audio. */
  #gate {
    position:fixed; inset:0; z-index:20; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:1.1rem;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(122,15,15,.55), transparent 60%),
      radial-gradient(100% 80% at 50% 120%, rgba(255,122,42,.18), transparent 55%),
      #08060a;
    transition:opacity .5s ease;
  }
  #gate.hidden { opacity:0; pointer-events:none; }
  #gate h1 {
    font-size:clamp(2.6rem, 9vw, 6rem); letter-spacing:.18em; font-weight:900;
    color:var(--red);
    text-shadow:0 0 18px rgba(226,59,46,.65), 0 0 50px rgba(122,15,15,.8);
  }
  #gate .sub { font-size:.95rem; letter-spacing:.32em; color:#9a8b7a; text-transform:uppercase; }
  #gate .cta {
    margin-top:.6rem; font-size:1rem; letter-spacing:.4em; color:var(--ember);
    border:1px solid rgba(255,122,42,.5); padding:.7rem 1.6rem; border-radius:3px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  #gate .hint { font-size:.72rem; letter-spacing:.12em; color:#5d5048; max-width:34rem; line-height:1.7; }

  #status {
    position:fixed; left:50%; bottom:8%; transform:translateX(-50%); z-index:21;
    font-size:.8rem; letter-spacing:.18em; color:#8a5; text-transform:uppercase;
  }
  #spinner {
    width:26px; height:26px; margin:.4rem auto 0; border-radius:50%;
    border:3px solid rgba(255,122,42,.25); border-top-color:var(--ember);
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .gone { display:none !important; }
</style>
</head>
<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="gate">
    <h1>HELLDROP</h1>
    <div class="sub">Reverse-Doom · Knee-Deep in His Blood</div>
    <div class="cta">▶ CLICK TO DESCEND</div>
    <div class="hint">
      He fights toward the exit. You drop the demons. &nbsp;1–9,0 pick a fiend ·
      LMB drops at the cursor · F slams a door/lift · V detonates a barrel ·
      C doomcam · TAB codex · G restart.
    </div>
  </div>

  <div id="status"><span id="status-text">downloading…</span><div id="spinner"></div></div>

  <script>
    var canvas    = document.getElementById('canvas');
    var gate      = document.getElementById('gate');
    var statusBox = document.getElementById('status');
    var statusTxt = document.getElementById('status-text');
    var spinner   = document.getElementById('spinner');
    var started   = false;

    var Module = {
      canvas: canvas,
      // Cache-bust: the build stamps its git revision here (Makefile), so a
      // returning visitor never pairs new code with a stale .wasm/.data.
      locateFile: function (p) { return p + '?v=HELLDROP_REV'; },
      print:    function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      setStatus: function (text) {
        if (!statusTxt) return;
        if (text) { statusTxt.textContent = text; }
        else if (!started) { statusTxt.textContent = 'ready'; }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left > 0) {
          Module.setStatus('loading hell ' + (this.totalDependencies - left) + '/' + this.totalDependencies);
        } else {
          // All preloaded data (the WAD) is in; the game is live behind the gate.
          Module.setStatus('');
          spinner.classList.add('gone');
        }
      }
    };
    Module.setStatus('downloading…');
    window.onerror = function (e) { Module.setStatus('error — see console'); console.error(e); };

    // The click-to-start gesture: reveal the canvas, hand keyboard focus to it,
    // and resume the WebAudio context raylib created (suspended) at startup.
    function startGame() {
      if (started) return;
      started = true;
      gate.classList.add('hidden');
      statusBox.classList.add('gone');
      setTimeout(function () { gate.classList.add('gone'); }, 600);
      try { canvas.focus(); } catch (e) {}
      try {
        var ctx = (Module.SDL2 && Module.SDL2.audioContext) ||
                  (window.AL && window.AL.currentCtx && window.AL.currentCtx.audioCtx);
        if (ctx && ctx.state === 'suspended') ctx.resume();
        if (typeof window.AudioContext !== 'undefined') {
          // miniaudio (raylib) parks its context on the document; nudge any that exist.
          document.querySelectorAll('*'); // no-op keep
        }
      } catch (e) {}
    }
    gate.addEventListener('click', startGame);
    gate.addEventListener('touchstart', startGame, { passive:true });
    window.addEventListener('keydown', function (e) {
      if (!started) { startGame(); }
      // Stop the browser from scrolling/space-activating while playing.
      if (started && [' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    });
    // Keep keyboard focus on the canvas when the player clicks into the game.
    canvas.addEventListener('mousedown', function () { try { canvas.focus(); } catch (e) {} });
  </script>

  {{{ SCRIPT }}}
</body>
</html>
