name: Helldrop
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Helldrop:
    type: application
    platform: iOS
    sources:
      - GameHost.m
      - playstats_ios.m
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
      - path: ../src
        includes: ["*.c", "*.h"]
      - path: ../third_party/libtess2/Source
    dependencies:
      - sdk: GLKit.framework
      - sdk: OpenGLES.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Accelerate.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ximg.helldrop
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: 3
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        INFOPLIST_FILE: Info.plist
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGN_STYLE: Automatic
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) PLATFORM_IOS GRAPHICS_API_OPENGL_ES3 GLES_SILENCE_DEPRECATION"
        GCC_OPTIMIZATION_LEVEL: "2"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../build/ios-$(PLATFORM_NAME)/src $(SRCROOT)/../src $(SRCROOT)/../third_party/libtess2/Include"
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/../build/ios-$(PLATFORM_NAME)/libraylib.a"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build native raylib
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          make -C "$SRCROOT/.." "build/ios-$PLATFORM_NAME/libraylib.a"
    postBuildScripts:
      - name: Bundle game assets
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/assets"
          mkdir -p "$dest/models"
          cp "$SRCROOT/../build/helldrop-web.wad" "$dest/helldrop.wad"
          cp "$SRCROOT/../assets/helldrop/CREDITS.txt" "$dest/CREDITS.txt"
          cp "$SRCROOT/ShipKit-LICENSE" "$dest/ShipKit-LICENSE"
          cp "$SRCROOT/../third_party/libtess2/LICENSE.txt" "$dest/libtess2-LICENSE.txt"
          rsync -a --delete "$SRCROOT/../assets/models/" "$dest/models/"
  HelldropUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Helldrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ximg.helldrop.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Helldrop
schemes:
  Helldrop:
    build:
      targets:
        Helldrop: all
    test:
      targets: [HelldropUITests]
